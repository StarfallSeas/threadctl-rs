# threadctl-rs 默认配置模板

[daemon]
pid_file = "./run/threadctl.pid"
ipc_socket = "./run/threadctl.sock"
# trace | debug | info | warn | error
log_level = "info"

[engine]
# auto | ebpf | proc | hybrid
#   auto   = 优先 eBPF，失败降级 /proc（降级目标是 hybrid 语义，eBPF 断开后 /proc 接管）
#   ebpf   = 强制 eBPF（无 eBPF 直接退出）
#   proc   = 强制 /proc 轮询
#   hybrid = eBPF 主源 + /proc 低频补漏（防 eBPF 白名单漏报）
mode = "auto"

# 秒；/proc 轮询间隔（仅 proc/hybrid 模式）
scan_interval = 2

# 秒；周期性重锁定间隔。
# Android 设备必须启用：AMS/ActivityManager 会在 App 切换时重置 CPU 亲和性，
# lock_interval 控制守护进程多久重新应用一次规则（即使没有收到新事件）。
# 桌面 Linux 可设为 0 禁用周期重锁定（仅事件驱动）。
lock_interval = 60

# 秒；已退出进程的 cpuset 引用清理间隔
dead_cleanup_interval = 15

# 规则示例：
[[rule]]
pkg = "com.miui.home"
cpus = "0-6"

[[rule]]
pkg = "com.miui.home"
thread = "RenderThread"
cpus = "7"
sched = "fifo:60"
nice = -10

[[rule]]
pkg = "com.miui.home"
thread = "com.miui.home"
cpus = "3-6"
sched = "fifo:60"
nice = -10

# 酷安
[[rule]]
pkg = "com.coolapk.market"
cpus = "0-6"

[[rule]]
pkg = "com.coolapk.market"
thread = "RenderThread"
cpus = "7"
sched = "fifo:60"
nice = -10

[[rule]]
pkg = "com.coolapk.market"
thread = ".coolapk.market"
cpus = "3-6"
sched = "fifo:60"
nice = -10

#
# 示例 2：音频线程固定小核（避免频率波动），主线程留大核
